name: MLOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        ruff check . --fix

    - name: Wait for Qdrant Service
      run: |
        until curl -s http://localhost:6333/healthz; do
          echo "Waiting for Qdrant..."
          sleep 2
        done

    - name: Ingest Test Data (CI)
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        QDRANT_URL: "http://localhost:6333"
        PYTHONPATH: .
      run: |
        python -c "
        from src.rag import engine;
        from langchain.schema import Document;
        docs = [
            Document(page_content='PDF was created by Adobe in 1993. It is based on PostScript language.', metadata={'source': 'test'}),
            Document(page_content='The ISO standard for PDF is ISO 32000.', metadata={'source': 'test'})
        ];
        engine.vector_store.add_documents(docs);
        print('✅ Test data ingested');
        "

    - name: Component Initialization Check
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
        LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        QDRANT_URL: "http://localhost:6333"
        PYTHONPATH: .
      run: |
        python -c "from src.rag import get_rag_chain; get_rag_chain()"

    - name: Execute Evaluation
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
        LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        QDRANT_URL: "http://localhost:6333"
        PYTHONPATH: .
      run: |
        python evaluation/run_eval.py || echo "Evaluation finished with warnings (CI non-blocking)"